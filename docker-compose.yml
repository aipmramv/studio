version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kti-assets-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - MONGODB_DATABASE=kti_assets
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-min-32-chars-long!!}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      - mongodb
    volumes:
      - ./backend/src:/app/src
    networks:
      - kti-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kti-assets-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:5000/api
    depends_on:
      - backend
    networks:
      - kti-network

  mongodb:
    image: mongo:7.0
    container_name: kti-assets-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=kti_assets
    volumes:
      - mongo_data:/data/db
    networks:
      - kti-network

volumes:
  mongo_data:

networks:
  kti-network:
    driver: bridge
